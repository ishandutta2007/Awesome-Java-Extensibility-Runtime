<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#1e112a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f89820" />
      <stop offset="50%" stop-color="#5382a1" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b827fc" />
      <stop offset="100%" stop-color="#2c73d2" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .node-orbit { fill: none; stroke: rgba(0, 242, 254, 0.15); stroke-dasharray: 6, 6; }
    
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes spinOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }

    .pulse-glow-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulse-glow-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .rotating-rings { animation: spinOrbit 35s linear infinite; transform-origin: 1050px 180px; }
    .flow-wave { stroke-dasharray: 10, 15; animation: waveDash 12s linear infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle High-Tech Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="160" cy="90" r="140" fill="url(#cyanGrad)" class="pulse-glow-1" filter="url(#glow)" />
  <circle cx="1040" cy="240" r="160" fill="url(#purpleGrad)" class="pulse-glow-2" filter="url(#glow)" />

  <!-- Animated Ambient Floating Particles -->
  <circle cx="220" cy="270" r="3.5" fill="#00f2fe" class="particle-1" />
  <circle cx="920" cy="80" r="4" fill="#f89820" class="particle-2" />
  <circle cx="560" cy="310" r="3" fill="#b827fc" class="particle-3" />
  <circle cx="80" cy="180" r="2.5" fill="#5382a1" class="particle-2" />

  <!-- Animated Data Orbit Rings on Right Side -->
  <g class="rotating-rings">
    <circle cx="1050" cy="180" r="90" class="node-orbit" />
    <circle cx="1050" cy="180" r="130" stroke="rgba(248, 152, 32, 0.15)" stroke-width="1.5" fill="none" stroke-dasharray="12, 8" />
    <circle cx="1140" cy="180" r="6" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="960" cy="180" r="5" fill="#f89820" filter="url(#glow)" />
    <circle cx="1050" cy="50" r="5" fill="#b827fc" filter="url(#glow)" />
  </g>

  <!-- Flowing Sine Path in Background -->
  <path d="M-50,290 C300,340 450,220 750,260 C950,290 1100,200 1250,230" fill="none" stroke="rgba(0, 242, 254, 0.22)" stroke-width="2" class="flow-wave" />

  <!-- Foreground Content Container (Ensures 100% Visibility and Contrast) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="30" rx="15" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="30" y="20" fill="#38bdf8" class="badge-text">⚡ ENTERPRISE RUNTIMES &amp; AOT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" class="title-text">
      Awesome <tspan fill="url(#javaGrad)">Java Extensibility</tspan> &amp; Runtime
    </text>

    <!-- Subtitle -->
    <text x="0" y="186" class="subtitle-text">
      Curated ecosystem of SaaS cloud runtimes, serverless functions, native AOT engines &amp; plugin frameworks
    </text>

    <!-- Interactive / High-Tech Metadata Tags in Foreground -->
    <g transform="translate(0, 226)">
      <!-- Tag 1: GraalVM Native -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="rgba(248, 152, 32, 0.12)" stroke="rgba(248, 152, 32, 0.35)" stroke-width="1" />
        <text x="20" y="23" fill="#fca311" class="badge-text">☕ GraalVM Native AOT</text>
      </g>
      <!-- Tag 2: Serverless Java -->
      <g transform="translate(182, 0)">
        <rect width="185" height="36" rx="8" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1" />
        <text x="20" y="23" fill="#38bdf8" class="badge-text">☁️ Serverless &amp; Cloud UDF</text>
      </g>
      <!-- Tag 3: Microservices & Modularity -->
      <g transform="translate(379, 0)">
        <rect width="200" height="36" rx="8" fill="rgba(184, 39, 252, 0.12)" stroke="rgba(184, 39, 252, 0.35)" stroke-width="1" />
        <text x="20" y="23" fill="#c084fc" class="badge-text">🧩 Modular Plugin Engines</text>
      </g>
      <!-- Tag 4: Sub-Second Cold Starts -->
      <g transform="translate(591, 0)">
        <rect width="180" height="36" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
        <text x="20" y="23" fill="#34d399" class="badge-text">🚀 Sub-Second Cold Starts</text>
      </g>
    </g>

    <!-- Bottom Metric / Update Bar -->
    <g transform="translate(0, 290)">
      <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13px" font-weight="500">
        ⭐ Verified Star Ratings • 📊 Accurate Enterprise Valuation &amp; Pricing • 🔄 Updated November 2026
      </text>
    </g>

  </g>
</svg>
